{% extends 'base.html' %}
{% block content %}
<h1 class="text-center my-4">فيديوهات الرعب</h1>
<div class="card p-4">
    {% for video in videos %}
    <div class="video">
        <h3>{{ video.title }}</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/{{ video.video_id }}" frameborder="0" allowfullscreen></iframe>
        <p>{{ video.description }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
